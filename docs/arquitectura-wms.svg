<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura actual de WMS Pro</title>
  <desc id="desc">Diagrama de React, Supabase Auth, Django REST API, Django Admin y PostgreSQL Supabase.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172554" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .step{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .boxTitle{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .boxText{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .arrowLabel{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .schema{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="70" y="65" class="title">Arquitectura actual · WMS Pro</text>
  <text x="70" y="95" class="subtitle">Frontend React + seguridad y negocio en Django + servicios administrados de Supabase</text>

  <!-- Usuario -->
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="180" height="160" rx="20" fill="#fff" stroke="#cbd5e1"/>
  </g>
  <circle cx="160" cy="225" r="28" fill="#e0e7ff"/>
  <circle cx="160" cy="217" r="9" fill="#4f46e5"/>
  <path d="M140 245c4-13 36-13 40 0" fill="none" stroke="#4f46e5" stroke-width="7" stroke-linecap="round"/>
  <text x="160" y="282" text-anchor="middle" class="boxTitle">Usuarios</text>
  <text x="160" y="309" text-anchor="middle" class="boxText">Administrador TI</text>
  <text x="160" y="330" text-anchor="middle" class="boxText">Jefatura · Operación</text>

  <!-- React -->
  <g filter="url(#shadow)">
    <rect x="340" y="155" width="300" height="210" rx="22" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  </g>
  <rect x="340" y="155" width="300" height="54" rx="22" fill="#2563eb"/>
  <path d="M340 187h300v22H340z" fill="#2563eb"/>
  <text x="365" y="190" class="step">1 · EXPERIENCIA DE USUARIO</text>
  <text x="370" y="248" class="boxTitle">React SPA</text>
  <text x="370" y="278" class="boxText">Vistas WMS y administración</text>
  <text x="370" y="303" class="boxText">Guarda la sesión en el navegador</text>
  <text x="370" y="328" class="boxText">Envía JWT en cada petición API</text>
  <rect x="516" y="230" width="92" height="34" rx="17" fill="#dbeafe"/>
  <text x="562" y="252" text-anchor="middle" class="small" fill="#1d4ed8">Vite + TS</text>

  <!-- Auth -->
  <g filter="url(#shadow)">
    <rect x="785" y="135" width="300" height="190" rx="22" fill="#fff" stroke="#6ee7b7" stroke-width="2"/>
  </g>
  <rect x="785" y="135" width="300" height="54" rx="22" fill="#059669"/>
  <path d="M785 167h300v22H785z" fill="#059669"/>
  <text x="810" y="170" class="step">2 · IDENTIDAD Y SESIONES</text>
  <text x="815" y="228" class="boxTitle">Supabase Auth</text>
  <text x="815" y="258" class="boxText">Inicio y cierre de sesión</text>
  <text x="815" y="283" class="boxText">Recuperación de contraseña</text>
  <text x="815" y="308" class="boxText">Emisión del access token JWT</text>

  <!-- Django -->
  <g filter="url(#shadow)">
    <rect x="470" y="475" width="390" height="240" rx="22" fill="#fff" stroke="#818cf8" stroke-width="2"/>
  </g>
  <rect x="470" y="475" width="390" height="54" rx="22" fill="#4338ca"/>
  <path d="M470 507h390v22H470z" fill="#4338ca"/>
  <text x="495" y="510" class="step">3 · SEGURIDAD Y REGLAS DE NEGOCIO</text>
  <text x="500" y="568" class="boxTitle">Django REST API</text>
  <text x="500" y="598" class="boxText">Valida JWT con JWKS de Supabase</text>
  <text x="500" y="623" class="boxText">Comprueba usuario activo, roles y permisos</text>
  <text x="500" y="648" class="boxText">Ejecuta las reglas del WMS y auditoría</text>
  <text x="500" y="673" class="boxText">Administra identidades con clave secreta</text>

  <!-- Admin -->
  <g filter="url(#shadow)">
    <rect x="70" y="510" width="280" height="170" rx="20" fill="#fff" stroke="#cbd5e1"/>
  </g>
  <text x="100" y="555" class="boxTitle">Django Admin</text>
  <text x="100" y="588" class="boxText">Soporte técnico interno</text>
  <text x="100" y="613" class="boxText">Inspección y contingencias</text>
  <text x="100" y="638" class="boxText">No reemplaza la interfaz React</text>

  <!-- DB -->
  <g filter="url(#shadow)">
    <rect x="1000" y="430" width="330" height="335" rx="22" fill="#fff" stroke="#6ee7b7" stroke-width="2"/>
  </g>
  <rect x="1000" y="430" width="330" height="54" rx="22" fill="#047857"/>
  <path d="M1000 462h330v22h-330z" fill="#047857"/>
  <text x="1025" y="465" class="step">4 · PERSISTENCIA</text>
  <text x="1030" y="523" class="boxTitle">PostgreSQL · Supabase</text>
  <text x="1030" y="553" class="boxText">Datos operativos y autorizaciones</text>
  <rect x="1030" y="577" width="125" height="37" rx="8" fill="#ecfdf5"/><text x="1092" y="601" text-anchor="middle" class="schema">usuarios</text>
  <rect x="1170" y="577" width="125" height="37" rx="8" fill="#ecfdf5"/><text x="1232" y="601" text-anchor="middle" class="schema">maestros</text>
  <rect x="1030" y="625" width="125" height="37" rx="8" fill="#ecfdf5"/><text x="1092" y="649" text-anchor="middle" class="schema">inventario</text>
  <rect x="1170" y="625" width="125" height="37" rx="8" fill="#ecfdf5"/><text x="1232" y="649" text-anchor="middle" class="schema">operaciones</text>
  <rect x="1030" y="682" width="265" height="53" rx="10" fill="#f1f5f9"/>
  <text x="1162" y="704" text-anchor="middle" class="small">Modelos existentes: managed=False</text>
  <text x="1162" y="724" text-anchor="middle" class="small">Django consulta; no crea esas tablas</text>

  <!-- Migrations -->
  <g filter="url(#shadow)">
    <rect x="465" y="785" width="535" height="80" rx="18" fill="#fff7ed" stroke="#fdba74"/>
  </g>
  <text x="495" y="817" class="boxTitle" font-size="18">Migraciones versionadas</text>
  <text x="495" y="844" class="boxText">Django base + SQL explícito (hoy: rack y posición en ubicación)</text>

  <!-- Arrows -->
  <path d="M250 260H330" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="290" y="246" text-anchor="middle" class="arrowLabel">HTTPS</text>

  <path d="M640 220C700 190 725 188 775 205" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="710" y="174" text-anchor="middle" class="arrowLabel">Credenciales</text>
  <path d="M785 270C730 300 700 302 648 285" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="714" y="330" text-anchor="middle" class="arrowLabel">Sesión + JWT</text>

  <path d="M505 365V465" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="520" y="415" class="arrowLabel">API + Bearer JWT</text>

  <path d="M840 475C905 405 934 345 934 335" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="925" y="395" text-anchor="middle" class="arrowLabel">JWKS / Admin Auth</text>

  <path d="M860 595H990" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="925" y="580" text-anchor="middle" class="arrowLabel">ORM + SQL</text>

  <path d="M350 595H460" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <text x="405" y="580" text-anchor="middle" class="arrowLabel">Servidor</text>

  <path d="M1000 825C1130 825 1165 810 1165 775" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-slate)"/>
  <text x="1120" y="852" text-anchor="middle" class="arrowLabel">manage.py migrate</text>

  <!-- Security boundary -->
  <rect x="430" y="405" width="940" height="380" rx="30" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 8"/>
  <rect x="452" y="393" width="240" height="28" rx="14" fill="#e2e8f0"/>
  <text x="572" y="412" text-anchor="middle" class="small">Zona segura · secretos solo en backend</text>

  <text x="70" y="870" class="small">Principio clave: React puede ocultar opciones, pero Django siempre vuelve a validar la autorización.</text>
</svg>
